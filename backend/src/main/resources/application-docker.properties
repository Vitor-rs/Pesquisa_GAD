# Configurações para ambiente Docker
spring.application.name=gad-backend

# Configuração específica para Codespaces
server.address=0.0.0.0
server.port=8080

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:gad_db}
spring.datasource.username=${POSTGRES_USER:gad_user}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar Spring Boot Docker Compose quando rodando em container
spring.docker.compose.enabled=false

# Configurações para upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configurações de desenvolvimento
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging
logging.level.com.gad=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
