services:
  # Banco de dados PostgreSQL
  postgres:
    image: 'postgres:15-alpine'
    container_name: gad-postgres
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-gad_db}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}'
      - 'POSTGRES_USER=${POSTGRES_USER:-gad_user}'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  # PGAdmin otimizado para Codespaces
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gad-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@gad.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_LISTEN_ADDRESS=0.0.0.0
      - PGADMIN_LISTEN_PORT=80
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
      - PGADMIN_CONFIG_WTF_CSRF_ENABLED=False
    ports:
      - '5050:80'
    depends_on:
      - postgres
    restart: unless-stopped

  # Aplicação Spring Boot
  app:
    build: .
    container_name: gad-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_DB=${POSTGRES_DB:-gad_db}
      - POSTGRES_USER=${POSTGRES_USER:-gad_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - SERVER_ADDRESS=0.0.0.0
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    restart: unless-stopped

volumes:
  postgres_data:
